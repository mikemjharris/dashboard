name: Deploy

# Uploads site/ to dashboard/ in the www bucket and clears that part of the
# CloudFront cache. The bucket, distribution and role are defined in
# mikemjharris/infra (terraform/web/sites).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC login to AWS; no AWS keys are stored in GitHub

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::702167621683:role/github-deploy-dashboard
  BUCKET: mikemjharris-www-702167621683
  DISTRIBUTION_ID: E1HR27O9OKYP4F

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write version.json
        run: |
          cat > site/version.json <<EOF
          {
              "commit": "${GITHUB_SHA}",
              "branch": "${GITHUB_REF_NAME}",
              "deploy_date": "$(date -u +%Y-%m-%d_%H-%M-%S)"
          }
          EOF

      - name: Upload to S3
        run: aws s3 sync site/ "s3://${BUCKET}/dashboard/" --delete --no-progress

      - name: Clear the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/dashboard/*" \
            --query 'Invalidation.Id' --output text
